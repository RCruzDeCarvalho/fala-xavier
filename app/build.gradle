plugins {
    id 'com.android.application'
}

android {
    namespace 'pt.ricardo.falaxavier'
    compileSdk 34

    defaultConfig {
        applicationId "pt.ricardo.falaxavier"
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName "1.4.1"
    }

    // Chave fixa: assim cada nova versão instala por cima da anterior sem perder cartões nem fotos.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release { minifyEnabled false }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
