name: Construir APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Preparar o APK
        id: apk
        run: |
          VERSAO=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          echo "versao=$VERSAO" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk pictovoz.apk
      - uses: actions/upload-artifact@v5
        with:
          name: pictovoz-apk
          path: pictovoz.apk
      - name: Publicar em Versões
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.versao }}-${{ github.run_number }}
          name: Pictovoz ${{ steps.apk.outputs.versao }} (compilação ${{ github.run_number }})
          files: pictovoz.apk
          make_latest: true
